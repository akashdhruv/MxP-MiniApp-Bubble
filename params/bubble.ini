# Deforming Bubble mini-app -- runtime parameters.
# Defaults mirror the Flash-X incompFlow/DeformingBubble setup except where the
# Spec records a deviation (CFL timestep instead of ins_dtSpec = 1e-5).
#
# Two defaults deviate from the Spec's stated values, both authorised by the
# human in the U9 round and both recorded in dev/tasks/init-project/log.md:
#
#   cfl  0.5 -> 0.05   Forward Euler + WENO5 is UNSTABLE at cfl = 0.5.  One
#                      revolution of an exactly divergence-free solid-body
#                      rotation (the circle must return unchanged) gives
#                      max|phi-phi0| = 2.9e-1 / 3.0e-1 / 1.6e+0 at 64/128/256
#                      -- error GROWING under refinement.  At cfl <= 0.2 it is
#                      flat at 2.4e-1 and the area drift falls as h.  The
#                      instability shows up in the plots as a serrated phi = 0
#                      contour.  Flash-X never meets it: ins_dtSpec = 1e-5 is
#                      CFL ~ 1e-3.  Keep cfl <= 0.1 with this integrator.
#
#   nx,ny 128 -> 256   At 128^2 the t = 2 filament is thinner than a cell, so
#                      the area drift is resolution-limited at ~35-38% for ANY
#                      timestep (cfl 0.05 -> 38.4%, cfl 0.02 -> 37.2%).  256^2
#                      resolves it: 2.8%, inside the Spec's 5% bar.

# --- mesh -------------------------------------------------------------------
nx   = 256
ny   = 256
xmin = 0.0
xmax = 1.0
ymin = 0.0
ymax = 1.0

# --- decomposition (0 = chosen by MPI_Dims_create) --------------------------
px = 0
py = 0

# --- initial condition: phi = bubble_r - |x - (bubble_x, bubble_y)| ---------
bubble_x = 0.75
bubble_y = 0.75
bubble_r = 0.1

# --- time integration -------------------------------------------------------
tmax         = 2.0
cfl          = 0.05     # NOT 0.5: forward Euler + WENO5 is unstable there
fixed_dt     = 0.0      # > 0 overrides the CFL estimate (bit-comparison runs)
max_steps    = 0        # > 0 caps the number of steps
reverse_time = false    # true => velocity scaled by cos(pi t / tmax)

# --- level set --------------------------------------------------------------
ls_iterations = 2       # mph_lsIt

# --- output -----------------------------------------------------------------
outdir        = out
plot_interval = 512     # ~40 frames over the 20478-step run (ASCII .vti)
hist_interval = 1
verbosity     = 1
